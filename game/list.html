<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 لوحة الشرف والتميز 🏆</title>
    <style>
        /* إعدادات الخطوط والألوان العامة */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* حاوية البرنامج الرئيسية */
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #4a47a3;
            font-size: 2.5rem;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* منطقة إدخال الأسماء */
        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4a47a3;
        }

        button.btn-add {
            background-color: #4a47a3;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s, transform 0.1s;
        }

        button.btn-add:hover {
            background-color: #353280;
        }

        button.btn-add:active {
            transform: scale(0.95);
        }

        /* تصميم قائمة المتسابقين */
        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contestant-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9ff;
            padding: 15px 20px;
            border-radius: 15px;
            border-right: 6px solid #ccc;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.4s ease;
        }

        /* تمييز المراكز الثلاثة الأولى */
        .contestant-card.rank-0 { border-right-color: #ffd700; background: #fffdf0; } /* ذهبي */
        .contestant-card.rank-1 { border-right-color: #c0c0c0; background: #f7f7f7; } /* فضي */
        .contestant-card.rank-2 { border-right-color: #cd7f32; background: #fdf6f0; } /* برونزي */

        .info-side {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank-badge {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
        }

        .name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        /* التحكم في الدرجات */
        .score-side {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-display {
            font-size: 1.4rem;
            font-weight: 900;
            color: #4a47a3;
            min-width: 50px;
            text-align: center;
        }

        .btn-score {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-plus { background-color: #4caf50; color: white; }
        .btn-plus:hover { background-color: #439e46; }

        .btn-minus { background-color: #f44336; color: white; }
        .btn-minus:hover { background-color: #da362a; }

        .btn-delete {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.1rem;
            margin-right: 10px;
            transition: color 0.2s;
        }
        .btn-delete:hover { color: #f44336; }

        /* رسالة في حالة عدم وجود متسابقين */
        .empty-msg {
            color: #888;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 لوحة الشرف والتميز 🏆</h1>
        
        <div class="input-section">
            <input type="text" id="contestantInput" placeholder="اكتب اسم المتسابق هنا..." onkeypress="checkEnter(event)">
            <button class="btn-add" onclick="addContestant()">إضافة ✨</button>
        </div>

        <div id="leaderboard" class="leaderboard">
            <p class="empty-msg">لا يوجد متسابقين حالياً، أضف بعض الحماس ولنبدأ! 🎉</p>
        </div>
    </div>

    <script>
        // مصفوفة لتخزين المتسابقين داحلها
        let contestants = [];

        // دالة لإضافة متسابق جديد
        function addContestant() {
            const input = document.getElementById('contestantInput');
            const name = input.value.trim();

            if (name === '') {
                alert('من فضلك ادخل اسم المتسابق أولاً ونوّر اللوحة! 🌟');
                return;
            }

            // إنشاء كائن للمتسابق الجديد بدرجة مبدئية = 0
            const newContestant = {
                id: Date.now(), // معرف فريد
                name: name,
                score: 0
            };

            contestants.push(newContestant);
            input.value = ''; // مسح الخانة بعد الإضافة
            updateLeaderboard();
        }

        // دالة لتحديث اللوحة وإعادة الترتيب تلقائياً
        function updateLeaderboard() {
            const leaderboardContainer = document.getElementById('leaderboard');
            leaderboardContainer.innerHTML = '';

            if (contestants.length === 0) {
                leaderboardContainer.innerHTML = '<p class="empty-msg">لا يوجد متسابقين حالياً، أضف بعض الحماس ولنبدأ! 🎉</p>';
                return;
            }

            // ترتيب المتسابقين تنازلياً حسب الدرجة الأعلى
            contestants.sort((a, b) => b.score - a.score);

            // بناء عناصر الواجهة بناءً على الترتيب الجديد
            contestants.forEach((contestant, index) => {
                // تحديد الوسام أو المركز
                let rankIcon = index + 1;
                let rankClass = '';
                
                if (index === 0) { rankIcon = '🥇'; rankClass = 'rank-0'; }
                else if (index === 1) { rankIcon = '🥈'; rankClass = 'rank-1'; }
                else if (index === 2) { rankIcon = '🥉'; rankClass = 'rank-2'; }

                const card = document.createElement('div');
                card.className = `contestant-card ${rankClass}`;
                
                card.innerHTML = `
                    <div class="info-side">
                        <div class="rank-badge">${rankIcon}</div>
                        <div class="name">${contestant.name}</div>
                    </div>
                    <div class="score-side">
                        <button class="btn-score btn-minus" onclick="changeScore(${contestant.id}, -1)">-</button>
                        <div class="score-display">${contestant.score}</div>
                        <button class="btn-score btn-plus" onclick="changeScore(${contestant.id}, 1)">+</button>
                        <button class="btn-delete" onclick="deleteContestant(${contestant.id})" title="حذف">🗑️</button>
                    </div>
                `;
                
                leaderboardContainer.appendChild(card);
            });
        }

        // دالة لتعديل الدرجات (+ أو -)
        function changeScore(id, amount) {
            const contestant = contestants.find(c => c.id === id);
            if (contestant) {
                contestant.score += amount;
                // نمنع الدرجات بالسالب لضمان شكل مشجع دائماً
                if (contestant.score < 0) contestant.score = 0; 
                updateLeaderboard();
            }
        }

        // دالة لحذف متسابق
        function deleteContestant(id) {
            contestants = contestants.filter(c => c.id !== id);
            updateLeaderboard();
        }

        // إمكانية الضغط على زر Enter لإضافة الاسم بسرعة
        function checkEnter(event) {
            if (event.key === 'Enter') {
                addContestant();
            }
        }
    </script>
</body>
</html>
