<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8" />
    <title> البلالين </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style/style.css">
</head>

<body>


    <div class="selection-panel" id="selection-panel">
        <div class="panel-card">
            <h2>اختر الفئة العمرية</h2>
            <div class="selection-buttons" id="age-buttons">
                <button class="option-btn age-select" data-age="kid">6 - 9 سنوات</button>
                <button class="option-btn age-select" data-age="teen">10 - 13 سنة</button>
                <button class="option-btn age-select" data-age="adult">18 سنة فأكثر</button>
            </div>
            <h2>اختر نوع الأسئلة</h2>
            <div class="selection-buttons" id="type-buttons">
                <button class="option-btn type-select" data-type="dini">أسئلة دينية</button>
                <button class="option-btn type-select" data-type="general">أسئلة عامة</button>
            </div>
            <button class="btn" id="start-btn" disabled>ابدأ اللعبة</button>
        </div>
    </div>
    <div class="w-100 py-3">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-12 order-1 order-lg-1">
                <div class="balloons-box" id="balloons-container"></div>
                <div class="question-box" id="question-box" aria-hidden="true">
                    <p id="question-text"></p>
                    <button class="close-btn" id="close-btn">إغلاق</button>
                </div>

                <div class="controls">
                    <button class="btn" id="reset-btn">إعادة اللعبة</button>
                </div>
            </div>
            <div class="col-lg-3 col-12 order-2 order-lg-2">
                <div class="leaderboard-section" id="leaderboard-section">
                    <div class="container">
                        <h1>🏆 لوحة الشرف والتميز 🏆</h1>
                        <div class="input-section">
                            <input type="text" id="contestantInput" placeholder="اكتب اسم المتسابق..."
                                onkeypress="checkEnter(event)">
                            <button class="btn-add" onclick="addContestant()">
                                إضافة ✨
                            </button>
                        </div>

                        <div id="leaderboard" class="leaderboard">
                            <p class="empty-msg">
                                لا يوجد متسابقين حالياً، أضف بعض الحماس ولنبدأ! 🎉
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <script src="script/script.js"></script>

</body>

</html>
